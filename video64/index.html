<head>

</head>
<body>
    <script>
        let rand = Math.random()
        let first, second,  third;
        // 0 0.33 0.66 1
        // Lets generate the first word

        if (rand<0.33){
            first = "Crazy"
        }
        else if(rand<0.66 && rand>=0.33){
            first = "Amazing"
        }

        else{
            first = "fire"}
            // Lets generate the second word
              rand = Math.random()

        if (rand<0.33){
            second = "microsoft"
        }
        else if(rand<0.66 && rand>=0.33){
            second = "Amazon"
        }

        else{
            second = "google"}
            // Lets generate the third word
             rand = Math.random()
        if (rand<0.33){
            third = "chair"
        }
        else if(rand<0.66 && rand>=0.33){
            third = "table"
        }

        else{
            third = "door"}
        console.log(first + " " + second + " " + third)
    </script>
    
</body>
